format_source:
  stage: build
  image: tobiashvmz/pve-cloud-pyci:202606072330 
  script:
    - git config --global user.name "$GITLAB_USER_NAME"
    - git config --global user.email "$GITLAB_USER_EMAIL"
    
    - autoflake --in-place --recursive .
    - black .
    - isort .
    # commit the changes
    - |
      if ! git diff --quiet; then
        git add .
        git commit -m "Format and cleanup pipeline"
        git push origin HEAD:$CI_COMMIT_REF_NAME
      else
        echo "Nothing to clean or format!"
      fi
  rules:
    - if: >
        $CI_COMMIT_TAG !~ /^\d+\.\d+\.\d+$/ &&
        $CI_COMMIT_TAG !~ /^\d+\.\d+\.\d+-rc\d+$/ &&
        $CI_COMMIT_TAG !~ /^release-[a-z]+$/ &&
        $CI_COMMIT_TAG !~ /^rc-[a-z]+$/ &&
        $CI_PIPELINE_SOURCE == 'push'
      when: on_success
    - when: never

source_rag_insert:
  stage: build
  image:
    name: "$PXC_INTEGRATION_REGISTRY/pytest-pve-cloud:pxc-3-stable"
    pull_policy: always
  rules:
    - if: >
        $PXC_INTEGRATION_REGISTRY != null &&
        $EMB_MODEL_SERVER_URL != null &&
        $EMB_MODEL_AUTH_HEADER_VALUE != null &&
        $EMB_MODEL_NAME != null &&
        $J2_QUERY_TEMPLATE_B64 != null
  script:
    - rag-inserter "$CI_PROJECT_PATH"
