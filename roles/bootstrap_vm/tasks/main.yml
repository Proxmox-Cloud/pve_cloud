---
# tasks file for create_node
- name: Get id for vm 
  command: pvesh get /cluster/nextid
  register: pve_id

- name: Set hostname
  set_fact:
    qemu_hostname: "{{ args.hostname if 'hostname' in args else lookup('community.general.random_pet') }}-{{ stack_name }}"

- set_fact:
    create_cmd: "qm create {{ pve_id.stdout }} --name '{{ qemu_hostname }}' {% for key, value in (qemu_root_parameters | ansible.builtin.combine(qemu_base_parameters) | ansible.builtin.combine(args.parameters)).items() %}--{{ key }} '{{ value }}' {% endfor %}"

- name: Debug print qm creation command
  debug:
    var: create_cmd

- name: Create VM
  ansible.builtin.command: "{{ create_cmd }}"

- name: Set tags
  ansible.builtin.command: "qm set {{ pve_id.stdout }} --tags '{{ stack_name }}.{{ pve_cloud_domain }},{{ args['k8s_roles'] | join(',') + ',' if 'k8s_roles' in args else ''}}{{ blake }}-blake'"

- name: Create dir images
  ansible.builtin.file:
    path: "/opt/images"
    state: directory
    recurse: yes

- name: Check if image exists
  stat:
    path: "/opt/images/{{ qemu_image_url.split('/')[-1] }}"
  register: image_file

- name: Download image
  get_url:
    url: "{{ qemu_image_url }}"
    dest: "/opt/images/{{ qemu_image_url.split('/')[-1] }}"
  when: not image_file.stat.exists

- name: check if postgres is available
  delegate_to: pxc-executor-host
  community.postgresql.postgresql_ping:
    host: "{{ pve_haproxy_floating_ip_internal }}"
    port: 5000
    login_db: postgres
    login_user: postgres
    login_password: "{{ postgres_password }}" 
  register: postgres_connection_check
  ignore_errors: yes

- name: Cloud mirror discovery
  delegate_to: pxc-executor-host
  alchemy_read:
    pg_conn_str: "{{ pg_conn_str }}"
    table: px_cloud_secrets
    where:
      cloud_domain: "{{ pve_cloud_domain }}"
      secret_name: "cloud-mirror-vm"
  register: mirror_discovery_secret
  when: postgres_connection_check.is_available

- name: Create user.yaml snippet
  template:
    src: "user-config.yaml.j2"
    dest: "/var/lib/vz/snippets/user-{{ pve_id.stdout }}.yaml"

- name: Cinit network config
  include_tasks: generate_cinit_net_cfg.yml

- name: Create network.yaml snippet
  copy:
    content: "{{ cinit_network_conf | to_yaml }}"
    dest: "/var/lib/vz/snippets/network-{{ pve_id.stdout }}.yaml"

- name: Set scsi0 with the specified disk and options
  ansible.builtin.command:
    cmd: qm set {{ pve_id.stdout }} --scsi0 {{ args["disk"]["pool"] }}:0,{% for key, value in args['disk']['options'].items() %}{{ key }}={{ value }}{% if not loop.last %},{% endif %}{% endfor %},import-from=/opt/images/{{ qemu_image_url.split('/')[-1] }}

- name: Resize the scsi0 disk
  ansible.builtin.command:
    cmd: qm resize {{ pve_id.stdout }} scsi0 +{{ args["disk"]["size"] }}

- name: Set IDE2 for cloud-init
  ansible.builtin.command:
    cmd: qm set {{ pve_id.stdout }} --ide2 {{ args["disk"]["pool"] }}:cloudinit

- name: Set boot order to scsi0
  ansible.builtin.command:
    cmd: qm set {{ pve_id.stdout }} --boot order=scsi0

- name: Set cloud-init custom configuration for user and network
  ansible.builtin.command:
    cmd: qm set {{ pve_id.stdout }} --cicustom "user=local:snippets/user-{{ pve_id.stdout }}.yaml,network=local:snippets/network-{{ pve_id.stdout }}.yaml"

# based on the serial label set for the disk we will later auto initialize the filesystem
- name: Create storage backed zfs pv disks
  loop_control:
    index_var: disk_idx
    loop_var: disk
  loop: "{{ args['zfs_localpv_csi_disks'] }}"
  when:
    - '"zfs_localpv_csi_disks" in args'
    - disk.from_storage | default(false)
  ansible.builtin.command:
    cmd: qm set {{ pve_id.stdout }} --scsi{{ disk_idx + 1 }} {{ disk["from_storage"]["pool"] }}:{{ disk["from_storage"]["size"] | regex_replace("G$", "") }},serial=scsi{{ disk_idx + 1 }}-pxzfs{% for key, value in disk['from_storage']['options'].items() %},{{ key }}={{ value }}{% endfor %}
# here we abuse the serial of the disk to later autocreate zfs, other options would include linking qemu inventory creation parameters to the vm that is later
# dynamically loaded. However this is not recommended, as we want to make vms created by pxc editiable through the proxmox ui without having things go out of sync.
# a user may have added things in retroactively to the vm and thereby only keeping the link through the initial created id hash. the vm itself should be the state...

- name: Create disk passthrough zfs pv disks
  loop_control:
    index_var: disk_idx
    loop_var: disk
  loop: "{{ args['zfs_localpv_csi_disks'] }}"
  when:
    - '"zfs_localpv_csi_disks" in args'
    - disk.via_passthrough | default(false)
  ansible.builtin.command:
    cmd: qm set {{ pve_id.stdout }} --scsi{{ disk_idx + 1 }} /dev/disk/by-id/{{ disk["via_passthrough"]["disk_id"] }},serial=scsi{{ disk_idx + 1 }}-pxzfs{% for key, value in disk['via_passthrough']['options'].items() %},{{ key }}={{ value }}{% endfor %}

# idx counter increment in case additional disks are defined for the vm
- set_fact:
    scsi_idx_zfs_base: "{{ 0 if 'zfs_localpv_csi_disks' not in args else (args['zfs_localpv_csi_disks'] | length) }}"

# generic additional disks that should be created, defined in qemu base schema
# todo: this | int pipe is triggering me
- name: create additional from pve storage hard drives if defined
  when:
    - '"additional_disks" in args'
    - disk.from_storage | default(false)
  loop_control:
    index_var: disk_idx
    loop_var: disk
  loop: "{{ args['additional_disks'] }}"
  ansible.builtin.command:
    cmd: qm set {{ pve_id.stdout }} --scsi{{ disk_idx + (scsi_idx_zfs_base | int) + 1 }} {{ disk["from_storage"]["pool"] }}:{{ disk["from_storage"]["size"] | regex_replace("G$", "") }}{% for key, value in disk['from_storage']['options'].items() %},{{ key }}={{ value }}{% endfor %}

- name: create additional via passthrough hard drives if defined
  when:
    - '"additional_disks" in args'
    - disk.via_passthrough | default(false)
  loop_control:
    index_var: disk_idx
    loop_var: disk
  loop: "{{ args['additional_disks'] }}"
  ansible.builtin.command:
    cmd: qm set {{ pve_id.stdout }} --scsi{{ disk_idx + (scsi_idx_zfs_base | int) + 1 }} /dev/disk/by-id/{{ disk["via_passthrough"]["disk_id"] }}{% for key, value in disk['via_passthrough']['options'].items() %},{{ key }}={{ value }}{% endfor %}

- name: Start the virtual machine
  ansible.builtin.command:
    cmd: qm start {{ pve_id.stdout }}
