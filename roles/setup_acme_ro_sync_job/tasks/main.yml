---
# tasks file for setup_acme_ro_sync_job

- name: Try read existing access secret
  delegate_to: "pxc-executor-host"
  alchemy_read:
    pg_conn_str: "{{ pg_conn_str }}"
    table: px_cloud_secrets
    where:
      cloud_domain: "{{ pve_cloud_domain }}"
      secret_name: "{{ stack_name }}-acme-ro-access"
  register: fetched_acme_ro_access

- debug:
    var: fetched_acme_ro_access

- name: Fail when postgres ro user not found
  when: fetched_acme_ro_access.rowcount != 1
  ansible.builtin.fail:
    msg: "Could not find read only acme postgres user!"

- name: install psql cli
  ansible.builtin.apt:
    name:
      - postgresql-client
      - jq
    update_cache: yes

- name: Ensure /opt/pxc-acme directory exists
  ansible.builtin.file:
    path: /opt/pxc-acme
    state: directory

- name: copy sync script
  template:
    src: pxc-acme-sync.sh.j2
    dest: /opt/pxc-acme/pxc-acme-sync.sh
    mode: '0755'
  vars:
    sync_postgres_user: "{{ fetched_acme_ro_access['query_result'][0]['secret_data']['username'] }}"
    sync_postgres_password: "{{ fetched_acme_ro_access['query_result'][0]['secret_data']['password'] }}"

- name: create the sync oneshot service
  template:
    dest: "/etc/systemd/system/pxc-acme-sync.service"
    src: pxc-acme-sync.service.j2

- name: install cron timer and setup service
  when: setup_systemd_acme_ro
  block:
    - name: run acme sync oneshot service
      ansible.builtin.service:
        daemon_reload: true
        name: pxc-acme-sync
        state: started
        enabled: yes

    - name: create daily acme sync timer
      template:
        dest: "/etc/systemd/system/pxc-acme-sync.timer"
        src: pxc-acme-sync.timer.j2

    - name: Reload systemd daemon
      command: systemctl daemon-reload

    - name: enable daily timer
      systemd:
        name: "pxc-acme-sync.timer"
        state: started
        enabled: yes
