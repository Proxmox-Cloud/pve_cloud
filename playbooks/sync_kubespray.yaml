- name: Rsync cache from mirror-vm if discovered
  hosts: localhost
  tasks:
    - name: Cloud mirror discovery
      delegate_to: pxc-executor-host
      alchemy_read:
        pg_conn_str: "{{ pg_conn_str }}"
        table: px_cloud_secrets
        where:
          cloud_domain: "{{ pve_cloud_domain }}"
          secret_name: "cloud-mirror-vm"
      register: mirror_discovery_secret

    - name: setup local cache
      when: mirror_discovery_secret.rowcount != 0
      block:
        - name: create local cache dir
          ansible.builtin.file:
            path: "{{ lookup('env', 'HOME') }}/.cache/kubespray"
            state: directory
            mode: '0755'
        
        - name: rsync cache from mirror vm
          command: rsync -avz admin@{{ mirror_discovery_secret.query_result[0]['secret_data']['mirror_vm_addr'] }}:/home/admin/.cache/kubespray/ {{ lookup('env', 'HOME') }}/.cache/kubespray/
        
        - name: set kubespray cache vars
          ansible.builtin.set_fact:
            download_run_once: true
            # executed pipe always on localhost, if docker installed we use docker caching funcs
            download_localhost: "{{ lookup('pipe', 'command -v docker >/dev/null && echo yes || echo no') == 'yes' }}"
          loop: "{{ groups['all'] + ['localhost'] }}"
          delegate_to: "{{ item }}"
          delegate_facts: true

# ! warning this is incomplete and does not 100% work like original ansible mechanisms, it assumes
# the same structure of the sample kubespray inventory vars
- name: Load preset kubespray all vars
  hosts: all
  tags:
    - kubespray
  tasks:
    - include_vars:
        dir: "{{ playbook_dir }}/kubespray/group_vars/all"
    - include_vars:
        dir: "{{ inventory_dir }}/group_vars/all" # overwrite in ansible traditional fashion
      ignore_errors: true # incase the user did not specify their own variables and is using our presets

- name: Load preset kubespray k8s_cluster vars
  hosts: k8s_cluster
  tags:
    - kubespray
  tasks:
    - include_vars:
        dir: "{{ playbook_dir }}/kubespray/group_vars/k8s_cluster"
    - include_vars:
        dir: "{{ inventory_dir }}/group_vars/k8s_cluster" 
      ignore_errors: true

    - name: limit e2e downloads containerd
      when: e2e_limit_containerd_downloads is defined and e2e_limit_containerd_downloads
      block:
        - name: create containerd conf.d
          ansible.builtin.file:
            path: /etc/containerd/conf.d
            state: directory

        - name: slow down pulls e2e systems
          ansible.builtin.set_fact:
            containerd_extra_args: |
              imports = ["/etc/containerd/conf.d/*.toml"]

        # validate with `containerd config dump | grep -A5 -B2 max_concurrent_downloads`
        - name: e2e dl limit conf.d file
          ansible.builtin.copy:
            dest: /etc/containerd/conf.d/99-e2e-limits.toml
            content: |
              [plugins."io.containerd.cri.v1.images"]
                max_concurrent_downloads = 1

              [plugins."io.containerd.transfer.v1.local"]
                max_concurrent_downloads = 1

- name: Kubespray
  tags:
    - kubespray
  ansible.builtin.import_playbook: kubernetes_sigs.kubespray.cluster

- name: Rsync cache from mirror-vm if discovered
  hosts: localhost
  tasks:
    - name: Cloud mirror discovery
      delegate_to: pxc-executor-host
      pxc.cloud.alchemy_read:
        pg_conn_str: "{{ pg_conn_str }}"
        table: px_cloud_secrets
        where:
          cloud_domain: "{{ pve_cloud_domain }}"
          secret_name: "cloud-mirror-vm"
      register: mirror_discovery_secret

    - name: rsync cache back to mirror vm
      when: mirror_discovery_secret.rowcount != 0
      command: rsync -avz {{ lookup('env', 'HOME') }}/.cache/kubespray/ admin@{{ mirror_discovery_secret.query_result[0]['secret_data']['mirror_vm_addr'] }}:/home/admin/.cache/kubespray/ 

- name: Allow locally hosted registry tdd
  hosts: k8s_cluster
  tasks:
    - name: Create containerd directory
      file:
        path: "/etc/containerd/certs.d/{{ test_repos_ip }}:5000"
        state: directory
      when: test_repos_ip is defined

    - name: Create hosts.toml for the repo
      copy:
        dest: "/etc/containerd/certs.d/{{ test_repos_ip }}:5000/hosts.toml"
        content: |
          server = "http://{{ test_repos_ip }}:5000"

          [host."http://{{ test_repos_ip }}:5000"]
            skip_verify = true

      when: test_repos_ip is defined
      register: create_hosts_toml

    - name: Restart containerd 
      service:
        name: containerd
        state: restarted
      when: test_repos_ip is defined and create_hosts_toml.changed

# Acme certificates
- name: Acme 
  hosts: pxc-executor-host
  tags:
    - acme
  roles:
    - pxc.cloud.parse_cluster_secrets
  tasks:
    - debug:
        var: cluster_cert_entries
    - include_role:
        name: pxc.cloud.apply_acme_certs
      when: acme_method is defined and cluster_cert_entries | length > 0

# core helm deployments
- name: Fetch nodes
  hosts: kube_node
  tags:
    - deployments
  tasks:
    # check if pxzfs tagged disks exist (for openebs zfs localpv setup)
    - name: List block devices
      ansible.builtin.command:
        cmd: lsblk --json -o NAME,PATH,SERIAL,FSTYPE
      register: lsblk_out

    - set_fact:
        block_devices: "{{ (lsblk_out.stdout | from_json).blockdevices }}"

    - set_fact:
        pxzfs_storage_node: >-
          {{
            block_devices
            | selectattr('serial', 'search', 'pxzfs$')
            | list | length > 0
          }}

- name: Fetch the kubeconfig from a master node
  hosts: kube_control_plane
  tags:
    - deployments
  tasks:
    - name: slurp kubeconfig
      slurp:
        src: "/etc/kubernetes/admin.conf"
      register: slurp_kubeconf
      run_once: true

    - set_fact:
        ext_kubeconfig: "{{ slurp_kubeconf.content | b64decode | replace('127.0.0.1',  ansible_default_ipv4.address)}}"
      run_once: true

- name: Deploy charts
  hosts: pxc-executor-host
  tags:
    - deployments
  roles:
    - pxc.cloud.parse_cluster_secrets
  vars:
    # default when no taints are set
    collected_node_taints: []
  tasks:
    - name: create temp path kubeconfig
      tempfile:
        state: file
        suffix: .yaml
      register: temp_kubeconfig

    - name: write kubeconf to temp file for following tasks
      copy:
        content: "{{ hostvars[groups['kube_control_plane'][0]].ext_kubeconfig }}"
        dest: "{{ temp_kubeconfig.path }}"

    # install volumesnapshot crds - checkout out at 189dfe4c1f307974c72d34d4b2d5c21b5c5c06ba from
    # https://github.com/kubernetes-csi/external-snapshotter/commits/master/
    - name: build volume snapshot crds
      ansible.builtin.shell: "kubectl kustomize {{ playbook_dir }}/snapshot-crd"
      register: snapshot_manifests
      delegate_to: localhost

    - debug:
        var: snapshot_manifests

    - name: install volume snapshot crds
      kubernetes.core.k8s:
        state: present
        definition: "{{ snapshot_manifests.stdout }}"
        kubeconfig: "{{ temp_kubeconfig.path }}"
      when: ceph_cluster_fsid is defined and ceph_csi_sc_pools is defined

    - name: collect taints from workers
      set_fact:
        collected_node_taints: "{{ collected_node_taints | default([]) + [ hostvars[item].node_taints ] }}"
      loop: "{{ groups['kube_node'] }}"
      when: hostvars[item].node_taints is defined

    # harbor mirror discovery
    - name: harbor cloud mirror discovery
      delegate_to: pxc-executor-host
      pxc.cloud.alchemy_read:
        pg_conn_str: "{{ pg_conn_str }}"
        table: px_cloud_secrets
        where:
          cloud_domain: "{{ pve_cloud_domain }}"
          secret_type: "harbor-admin-auth"
      register: harbor_mirror_secret

    - when: harbor_mirror_secret.rowcount != 0
      set_fact:
        mirror_repo_host: "{{ harbor_mirror_secret.query_result[0]['secret_data']['harbor_host'] }}"
        mirror_repo_username: "{{ harbor_mirror_secret.query_result[0]['secret_data']['full_name'] }}"
        mirror_repo_password: "{{ harbor_mirror_secret.query_result[0]['secret_data']['secret'] }}"

    - name: login to the mirror registry
      when: harbor_mirror_secret.rowcount != 0
      ansible.builtin.command: "helm registry login {{ mirror_repo_host }} --username '{{ mirror_repo_username }}' --password '{{ mirror_repo_password }}'"

    # mirror charts and images
    - name: mirror artifacts
      when: harbor_mirror_secret.rowcount != 0
      block:
        # ceph csi chart + images
        - name: mirror ceph-csi chart
          include_role:
            name: pxc.cloud.mirror_helm_chart
          vars:
            helm_repository_url: https://ceph.github.io/csi-charts
            helm_repository_name: ceph
            helm_chart_name: ceph-csi-rbd
            helm_chart_version: 3.14.2

        - name: mirror ceph-csi image
          include_role:
            name: pxc.cloud.mirror_container_image
          vars:
            image_registry: registry.k8s.io
            image_name: sig-storage/csi-provisioner
            image_version: v5.1.0

        - name: mirror ceph-csi image
          include_role:
            name: pxc.cloud.mirror_container_image
          vars:
            image_registry: registry.k8s.io
            image_name: sig-storage/csi-resizer
            image_version: v1.13.1

        - name: mirror ceph-csi image
          include_role:
            name: pxc.cloud.mirror_container_image
          vars:
            image_registry: registry.k8s.io
            image_name: sig-storage/csi-attacher
            image_version: v4.8.0

        - name: mirror ceph-csi image
          include_role:
            name: pxc.cloud.mirror_container_image
          vars:
            image_registry: registry.k8s.io
            image_name: sig-storage/csi-snapshotter
            image_version: v8.2.0

        - name: mirror ceph-csi image
          include_role:
            name: pxc.cloud.mirror_container_image
          vars:
            image_registry: quay.io
            image_name: cephcsi/cephcsi
            image_version: v3.14.2
          
        - name: mirror ceph-csi image
          include_role:
            name: pxc.cloud.mirror_container_image
          vars:
            image_registry: registry.k8s.io
            image_name: sig-storage/csi-node-driver-registrar
            image_version: v2.13.0

        # nginx ingress chart + images
        - name: mirror nginx-ingress chart
          include_role:
            name: pxc.cloud.mirror_helm_chart
          vars:
            helm_repository_url: https://kubernetes.github.io/ingress-nginx
            helm_repository_name: nginx
            helm_chart_name: ingress-nginx
            helm_chart_version: 4.14.0

        - name: mirror nginx-ingress image
          include_role:
            name: pxc.cloud.mirror_container_image
          vars:
            image_registry: registry.k8s.io
            image_name: ingress-nginx/controller
            image_version: v1.14.0

        - name: mirror nginx-ingress image
          include_role:
            name: pxc.cloud.mirror_container_image
          vars:
            image_registry: registry.k8s.io
            image_name: ingress-nginx/kube-webhook-certgen
            image_version: v1.6.4

        # mirror openebs
        - name: mirror openebs chart
          include_role:
            name: pxc.cloud.mirror_helm_chart
          vars:
            helm_repository_url: "https://openebs.github.io/openebs"
            helm_repository_name: openebs
            helm_chart_name: openebs
            helm_chart_version: 4.4.0

        - name: mirror openebs images
          include_role:
            name: pxc.cloud.mirror_container_image
          vars:
            image_registry: registry.k8s.io
            image_name: sig-storage/csi-resizer
            image_version: v1.13.2

        - name: mirror openebs images
          include_role:
            name: pxc.cloud.mirror_container_image
          vars:
            image_registry: registry.k8s.io
            image_name: sig-storage/csi-snapshotter
            image_version: v8.2.0

        - name: mirror openebs images
          include_role:
            name: pxc.cloud.mirror_container_image
          vars:
            image_registry: registry.k8s.io
            image_name: sig-storage/snapshot-controller
            image_version: v8.2.0

        - name: mirror openebs images
          include_role:
            name: pxc.cloud.mirror_container_image
          vars:
            image_registry: registry.k8s.io
            image_name: sig-storage/csi-provisioner
            image_version: v5.2.0

        - name: mirror openebs images
          include_role:
            name: pxc.cloud.mirror_container_image
          vars:
            image_registry: docker.io
            image_name: openebs/zfs-driver
            image_version: 2.9.0

        - name: mirror openebs images
          include_role:
            name: pxc.cloud.mirror_container_image
          vars:
            image_registry: registry.k8s.io
            image_name: sig-storage/csi-node-driver-registrar
            image_version: v2.13.0

        - name: mirror openebs images
          include_role:
            name: pxc.cloud.mirror_container_image
          vars:
            image_registry: docker.io
            image_name: openebs/provisioner-localpv
            image_version: 4.4.0

    # kubernetes.core comes from kubespray collection
    - name: ceph csi repo
      kubernetes.core.helm_repository:
        name: ceph-csi
        repo_url: https://ceph.github.io/csi-charts
      when: 
        - ceph_cluster_fsid is defined and ceph_csi_sc_pools is defined
        - harbor_mirror_secret.rowcount == 0
    
    - name: create ceph csi namespace
      kubernetes.core.k8s:
        name: ceph-csi
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: "{{ temp_kubeconfig.path }}"

    - name: create mirror pull secret
      when: harbor_mirror_secret.rowcount != 0
      kubernetes.core.k8s:
        kubeconfig: "{{ temp_kubeconfig.path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: mirror-pull-secret
            namespace: ceph-csi
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: "{{ harbor_mirror_secret.query_result[0]['secret_data']['dockerconfig'] | b64encode }}"

    - name: deploy csi chart
      kubernetes.core.helm:
        name: ceph-csi
        chart_ref: "{{ 'ceph-csi/ceph-csi-rbd' if harbor_mirror_secret.rowcount == 0 else 'oci://' ~ harbor_mirror_secret.query_result[0]['secret_data']['harbor_host'] ~ '/cloud-helm-mirror/ceph/ceph-csi-rbd'}}"
        chart_version: 3.14.2
        values: "{{ lookup('template', 'ceph-csi-values.yaml.j2') | from_yaml }}"
        kubeconfig: "{{ temp_kubeconfig.path }}"
        release_namespace: ceph-csi
        update_repo_cache: true
      when: ceph_cluster_fsid is defined and ceph_csi_sc_pools is defined
      
    - name: create csi manifests
      kubernetes.core.k8s:
        state: present
        template: ceph-csi-sc.yaml.j2
        kubeconfig: "{{ temp_kubeconfig.path }}"
      when: ceph_cluster_fsid is defined and ceph_csi_sc_pools is defined

    - name: ingress nginx repo
      when: harbor_mirror_secret.rowcount == 0
      kubernetes.core.helm_repository:
        name: ingress-nginx
        repo_url: https://kubernetes.github.io/ingress-nginx

    - name: create nginx ingress namespace
      kubernetes.core.k8s:
        name: nginx-ingress
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: "{{ temp_kubeconfig.path }}"

    - name: create mirror pull secret
      when: harbor_mirror_secret.rowcount != 0
      kubernetes.core.k8s:
        kubeconfig: "{{ temp_kubeconfig.path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: mirror-pull-secret
            namespace: nginx-ingress
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: "{{ harbor_mirror_secret.query_result[0]['secret_data']['dockerconfig'] | b64encode }}"

    - name: deploy ingress chart
      kubernetes.core.helm:
        name: nginx-ingress
        chart_ref: "{{ 'ingress-nginx/ingress-nginx' if harbor_mirror_secret.rowcount == 0 else 'oci://' ~ harbor_mirror_secret.query_result[0]['secret_data']['harbor_host'] ~ '/cloud-helm-mirror/nginx/ingress-nginx'}}"
        chart_version: 4.14.0
        values: "{{ lookup('template', 'nginx-ingress-values.yaml.j2') | from_yaml }}"
        kubeconfig: "{{ temp_kubeconfig.path }}"
        release_namespace: nginx-ingress
        update_repo_cache: true
        timeout: 15m # slow tdd systems

    # determine if openebs zfs csi should be deployed
    - set_fact:
        openebs_zfs_kubelet_dir: "/var/lib/kubelet/"
        pxzfs_storage_hosts: >-
          {{
            groups['kube_node']
            | map('extract', hostvars)
            | selectattr('pxzfs_storage_node', 'defined')
            | selectattr('pxzfs_storage_node', 'equalto', true)
            | map(attribute='ansible_hostname')
            | list
          }}

    - debug:
        var: pxzfs_storage_hosts

    - name: create openebs namespace
      kubernetes.core.k8s:
        name: openebs
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: "{{ temp_kubeconfig.path }}"
      when: pxzfs_storage_hosts | length > 0

    - name: create mirror pull secret
      when:
        - pxzfs_storage_hosts | length > 0
        - harbor_mirror_secret.rowcount != 0
      kubernetes.core.k8s:
        kubeconfig: "{{ temp_kubeconfig.path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: mirror-pull-secret
            namespace: openebs
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: "{{ harbor_mirror_secret.query_result[0]['secret_data']['dockerconfig'] | b64encode }}"

    - name: deploy openebs localpv zfs chart
      kubernetes.core.helm:
        name: openebs
        chart_ref: "{{ 'openebs/openebs' if harbor_mirror_secret.rowcount == 0 else 'oci://' ~ harbor_mirror_secret.query_result[0]['secret_data']['harbor_host'] ~ '/cloud-helm-mirror/openebs/openebs'}}"
        chart_version: 4.4.0
        values: "{{ lookup('template', 'openebs-values.yaml.j2') | from_yaml }}"
        kubeconfig: "{{ temp_kubeconfig.path }}"
        release_namespace: openebs
        update_repo_cache: true
        timeout: 15m # slow tdd systems
      when: pxzfs_storage_hosts | length > 0

    - name: create zvol storage class
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ temp_kubeconfig.path }}"
        template: openebs-zfs-localpv-sc.yaml.j2
      when: pxzfs_storage_hosts | length > 0
