- name: Sync / create nodes
  hosts: target_pve
  vars:
    vm_type: "qemu"
  tags:
    - qemus
  roles:
    - configure_pxc_ansible_cfg
    - slurp_cluster_secrets
    - parse_cluster_secrets
  tasks:
    - include_role:
        name: determine_vms_create_delete
      vars:
        vms: "{{ qemus }}"
      run_once: true

    - pause:
        prompt: "{{ delete_create['vms_to_delete'] | to_nice_json }}\n\nThe playbook determined the above mentioned vms to delete - continue? (yes/no)"
      register: user_input
      when: (delete_create['vms_to_delete'] | length) > 0
      run_once: true

    - fail:
        msg: "User declined to continue. Aborting playbook."
      when: (delete_create['vms_to_delete'] | length) > 0 and user_input.user_input | lower != 'yes'
      run_once: true

    - name: Delete qemus
      ansible.builtin.shell: |
        qm stop {{ vm_id }}
        while qm status {{ vm_id }} | grep -q "status: running"; do
          echo "Waiting for vm to stop..."
          sleep 2
        done
        qm destroy {{ vm_id }} --purge
      ignore_errors: true
      loop: "{{ delete_create['vms_to_delete'] }}"
      vars:
        vm_id: "{{ item['vmid'] }}"
      when: inventory_hostname == item['node'] + "." + pve_cluster

    - include_role:
        name: set_memory_facts
      when: (delete_create['vms_to_create'] | length) > 0

    - include_role:
        name: determine_best_fit
      when: (delete_create['vms_to_create'] | length) > 0
      run_once: true

    - include_role:
        name: bootstrap_vm
      loop: "{{ best_fit['best_distribution'] | zip(best_fit['best_fitted_hosts']) | list }}" # combine the lists
      when: (delete_create['vms_to_create'] | length) > 0 and inventory_hostname == item[1] # execute on target host
      vars:
        blake: "{{ item[0][0] }}"
        args: "{{ item[0][1] }}"

    - name: Give pve some time to sync conf for api calls
      ansible.builtin.wait_for:
        timeout: 10
      delegate_to: localhost

    - name: Reload inventory to get created lxcs for next play
      meta: refresh_inventory

    # remove cloudinit drives + set ha
    - name: Get existing vms
      command: pvesh get /cluster/resources --type vm --output-format json
      register: pve_vms
      run_once: true

    - set_fact:
        stack_vms: "{{ pve_vms.stdout | from_json |  selectattr('tags', 'defined') | selectattr('tags', 'search', stack_name + '.' + pve_cloud_domain) | list }}"
      run_once: true
      
    - name: Delete cloudinit drive
      command: qm set {{ item['vmid'] }} --delete ide2
      ignore_errors: true
      loop: "{{ stack_vms }}"
      when: inventory_hostname == item['node'] + "." + pve_cluster
      register: cloudinit_deletion

    - name: Set ha if enabled
      when: pve_ha_group is defined
      command: ha-manager add vm:{{ item['vmid'] }} --group {{ pve_ha_group }}
      ignore_errors: true
      loop: "{{ stack_vms }}"
      run_once: true

    - name: Remove ha if disabled
      when: pve_ha_group is not defined
      command: ha-manager remove vm:{{ item['vmid'] }}
      ignore_errors: true
      loop: "{{ stack_vms }}"
      run_once: true
      
    # trigger reboot when cloud init drive exists and got deleted
    # this is needed to allow for live migrations later on
    - name: Reboot vm to remove cinit drive
      ansible.builtin.command: "qm reboot {{ item.item.vmid }}"
      loop: "{{ cloudinit_deletion.results }}"
      when: 
        - item.skipped is not defined or not item.skipped # skipped is defined when the command skips on when:
        - item.rc == 0 and item.stderr == "" # command ran and it ran successfully
      register: cinit_del_reboot
    
    # todo: this should be optimized by a custom module that waits for a vm to be ready
    # after creation through the bootstrap vm method. currently we reload two times. both times
    # might be entirely unnessecary but meta: refresh_inventory doesnt support when:
    - name: Reload again incase any vm rebooted during cinit removal
      meta: refresh_inventory

# pve cloud infrastructure configuration
- name: Fetch k8s_cluster
  hosts: k8s_cluster
  tags:
    - config

- name: Slurp secrets 
  hosts: target_pve
  tags:
    - config
    - acme
    - deployments
    - zfs
  roles:
    - slurp_cluster_secrets

- name: Write k8s config
  hosts: localhost
  tags:
    - config
  vars:
    proxy_stack_fqdn: "{{ static_includes.proxy_stack }}"
  roles:
    - parse_cluster_secrets
    - set_kube_dns_records
    - set_k8s_conf_records
    - set_k8s_bind_domains

- name: Config for all nodes in k8s cluster
  hosts: k8s_cluster
  tags:
    - config
    - zfs
  roles:
    - parse_cluster_secrets
    - overwrite_apt_mirror
    - set_kea_reservations
    - adjust_networkd_oom_score
    - ssh_enforce_key_auth
  tasks:
    - name: install automation pubkey
      lineinfile:
        path: /home/{{ "admin" if qemu_default_user is undefined else qemu_default_user }}/.ssh/authorized_keys
        line: "{{ cluster_automation_pub_key | b64decode | trim }}"
        state: present

    - name: install additional core user keys
      lineinfile:
        path: /home/{{ "admin" if qemu_default_user is undefined else qemu_default_user }}/.ssh/authorized_keys
        line: "{{ item }}"
        state: present
      loop: "{{ additional_root_ssh_pub_keys }}"
      when: additional_root_ssh_pub_keys is defined

    - name: setup zfs csi if specifid in qemu params
      when: '"zpool_csi_parameters" in vm_params_self'
      include_role:
        name: pxc.cloud.setup_pxzfs_localpv_zpool
      vars:
        zpool_vdevs: "{{ vm_params_self['zpool_csi_parameters']['vdevs'] }}"
        zpool_properties: "{{ vm_params_self['zpool_csi_parameters']['pool_properties'] }}"

    # dynamically set file inotify watches and instances
    # needed for any kind of logging driver, prevents too many files open error
    # caused by lots of pods
    - set_fact:
        recommended_watches: "{{ (ansible_memtotal_mb * 10.24) | int }}"
        recommended_instances: "{{ (ansible_memtotal_mb / 16) | int }}"

    - name: set sysctl inotify
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - { key: 'fs.inotify.max_user_instances', value: "{{ [1024, [recommended_instances | int, 8192] | min] | max }}" }
        - { key: 'fs.inotify.max_user_watches', value: "{{ [524288, [recommended_watches | int, 2097152] | min] | max }}" }

    # vector logs export for node services
    - name: install vector journald exporter
      include_role:
        name: vector_journald_exporter

